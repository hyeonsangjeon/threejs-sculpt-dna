name: Quality

on:
  pull_request:
    paths:
      - "plugin.json"
      - ".codex-plugin/**"
      - ".github/plugin/**"
      - ".github/workflows/**"
      - "skills/**"
      - "scripts/**"
      - "adapters/**"
      - "tests/**"
      - "docs/**"
      - "examples/**"
      - "assets/**"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "UPSTREAM.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "capability-proof.json"
      - "script-policy.json"
  push:
    branches: [main]
    paths:
      - "plugin.json"
      - ".codex-plugin/**"
      - ".github/plugin/**"
      - ".github/workflows/**"
      - "skills/**"
      - "scripts/**"
      - "adapters/**"
      - "tests/**"
      - "docs/**"
      - "examples/**"
      - "assets/**"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "UPSTREAM.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "capability-proof.json"
      - "script-policy.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run self-contained proof suite
        run: python3 scripts/prove.py --output proof-run.json --commit "$GITHUB_SHA"

  browser-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: examples/repolis-hero
            capture-test: true
            proof-test: false
            runtime-test: false
          - directory: examples/brick-offroad-hero
            capture-test: true
            proof-test: false
            runtime-test: false
          - directory: examples/seoul-palace-hero
            capture-test: true
            proof-test: false
            runtime-test: false
          - directory: examples/showcase
            capture-test: false
            proof-test: false
            runtime-test: false
          - directory: examples/proof-lab
            capture-test: false
            proof-test: true
            runtime-test: false
          - directory: examples/react-three-fiber
            capture-test: false
            proof-test: false
            runtime-test: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci
      - name: Audit all dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high
      - name: Audit production dependency boundary
        working-directory: ${{ matrix.directory }}
        run: npm audit --omit=dev --audit-level=high
      - name: Run Brick Python-to-Node factory contracts
        if: matrix.directory == 'examples/brick-offroad-hero'
        run: python3 -m unittest tests.test_brick_offroad_hero -q
      - name: Run capture and factory contract tests
        if: matrix.capture-test
        working-directory: ${{ matrix.directory }}
        run: npm run test:capture
      - name: Run Proof Lab data contracts
        if: matrix.proof-test
        working-directory: ${{ matrix.directory }}
        run: npm test
      - name: Run React adapter example contracts
        if: matrix.runtime-test
        working-directory: ${{ matrix.directory }}
        run: npm test
      - name: Build example
        working-directory: ${{ matrix.directory }}
        run: npm run build

  generated-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/showcase/package-lock.json
      - name: Install parser toolchain
        working-directory: examples/showcase
        run: npm ci
      - name: Generate a production factory
        run: >-
          python3 scripts/generate_threejs_factory.py
          examples/repolis-tree/object-sculpt-spec.json
          --out "${RUNNER_TEMP}/createRepolisModel.ts"
      - name: Parse generated TypeScript
        run: >-
          examples/showcase/node_modules/.bin/esbuild
          "${RUNNER_TEMP}/createRepolisModel.ts"
          --loader:.ts=ts
          --format=esm
          --bundle
          --external:three
          --outfile="${RUNNER_TEMP}/createRepolisModel.mjs"

  react-three-fiber-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adapters/react-three-fiber/package-lock.json
      - name: Install locked adapter dependencies
        working-directory: adapters/react-three-fiber
        run: npm ci
      - name: Audit adapter dependencies
        working-directory: adapters/react-three-fiber
        run: npm audit --audit-level=high
      - name: Audit adapter production boundary
        working-directory: adapters/react-three-fiber
        run: npm audit --omit=dev --audit-level=high
      - name: Test mount, rebuild, frame, and cleanup contracts
        working-directory: adapters/react-three-fiber
        run: npm test
      - name: Build adapter package
        working-directory: adapters/react-three-fiber
        run: npm run build
      - name: Verify committed adapter output
        run: git diff --exit-code -- adapters/react-three-fiber/dist
