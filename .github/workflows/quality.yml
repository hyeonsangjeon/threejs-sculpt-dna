name: Quality

on:
  pull_request:
    paths:
      - "plugin.json"
      - ".github/plugin/**"
      - ".github/workflows/**"
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "examples/**"
      - "assets/**"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "UPSTREAM.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "capability-proof.json"
      - "script-policy.json"
  push:
    branches: [main]
    paths:
      - "plugin.json"
      - ".github/plugin/**"
      - ".github/workflows/**"
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "examples/**"
      - "assets/**"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "UPSTREAM.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "capability-proof.json"
      - "script-policy.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run self-contained proof suite
        run: python3 scripts/prove.py --output proof-run.json --commit "$GITHUB_SHA"

  browser-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: examples/repolis-hero
            capture-test: true
            proof-test: false
          - directory: examples/brick-offroad-hero
            capture-test: true
            proof-test: false
          - directory: examples/seoul-palace-hero
            capture-test: true
            proof-test: false
          - directory: examples/showcase
            capture-test: false
            proof-test: false
          - directory: examples/proof-lab
            capture-test: false
            proof-test: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci
      - name: Audit all dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high
      - name: Audit production dependency boundary
        working-directory: ${{ matrix.directory }}
        run: npm audit --omit=dev --audit-level=high
      - name: Run Brick Python-to-Node factory contracts
        if: matrix.directory == 'examples/brick-offroad-hero'
        run: python3 -m unittest tests.test_brick_offroad_hero -q
      - name: Run capture and factory contract tests
        if: matrix.capture-test
        working-directory: ${{ matrix.directory }}
        run: npm run test:capture
      - name: Run Proof Lab data contracts
        if: matrix.proof-test
        working-directory: ${{ matrix.directory }}
        run: npm test
      - name: Build example
        working-directory: ${{ matrix.directory }}
        run: npm run build

  generated-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/showcase/package-lock.json
      - name: Install parser toolchain
        working-directory: examples/showcase
        run: npm ci
      - name: Generate a production factory
        run: >-
          python3 scripts/generate_threejs_factory.py
          examples/repolis-tree/object-sculpt-spec.json
          --out "${RUNNER_TEMP}/createRepolisModel.ts"
      - name: Parse generated TypeScript
        run: >-
          examples/showcase/node_modules/.bin/esbuild
          "${RUNNER_TEMP}/createRepolisModel.ts"
          --loader:.ts=ts
          --format=esm
          --bundle
          --external:three
          --outfile="${RUNNER_TEMP}/createRepolisModel.mjs"
