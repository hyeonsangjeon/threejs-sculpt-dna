name: Deploy flagship demos

on:
  push:
    branches: [main]
    paths:
      - "examples/repolis-hero/**"
      - "examples/brick-offroad-hero/**"
      - "examples/seoul-palace-hero/**"
      - "examples/seoul-challenge/**"
      - "examples/showcase/**"
      - "examples/proof-lab/**"
      - "examples/react-three-fiber/**"
      - "adapters/react-three-fiber/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "plugin.json"
      - ".codex-plugin/plugin.json"
      - ".github/plugin/**"
      - "capability-proof.json"
      - "script-policy.json"
      - ".github/workflows/deploy-repolis-hero.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            examples/repolis-hero/package-lock.json
            examples/brick-offroad-hero/package-lock.json
            examples/seoul-palace-hero/package-lock.json
            examples/showcase/package-lock.json
            examples/proof-lab/package-lock.json
            examples/react-three-fiber/package-lock.json
            adapters/react-three-fiber/package-lock.json
      - name: Install Repolis dependencies
        working-directory: examples/repolis-hero
        run: npm ci
      - name: Build Repolis root
        working-directory: examples/repolis-hero
        run: npm run build
      - name: Test Repolis capture isolation
        working-directory: examples/repolis-hero
        run: npm run test:capture
      - name: Audit Repolis dependencies
        working-directory: examples/repolis-hero
        run: npm audit --audit-level=high
      - name: Install Brick dependencies
        working-directory: examples/brick-offroad-hero
        run: npm ci
      - name: Audit Brick dependencies
        working-directory: examples/brick-offroad-hero
        run: npm audit --audit-level=high
      - name: Install showcase dependencies
        working-directory: examples/showcase
        run: npm ci
      - name: Audit showcase dependencies
        working-directory: examples/showcase
        run: npm audit --audit-level=high
      - name: Install Seoul dependencies
        working-directory: examples/seoul-palace-hero
        run: npm ci
      - name: Audit Seoul dependencies
        working-directory: examples/seoul-palace-hero
        run: npm audit --audit-level=high
      - name: Install Proof Lab dependencies
        working-directory: examples/proof-lab
        run: npm ci
      - name: Audit Proof Lab dependencies
        working-directory: examples/proof-lab
        run: npm audit --audit-level=high
      - name: Audit Proof Lab production boundary
        working-directory: examples/proof-lab
        run: npm audit --omit=dev --audit-level=high
      - name: Test Proof Lab data contracts
        working-directory: examples/proof-lab
        run: npm test
      - name: Install React Three Fiber adapter dependencies
        working-directory: adapters/react-three-fiber
        run: npm ci
      - name: Audit React Three Fiber adapter
        working-directory: adapters/react-three-fiber
        run: npm audit --audit-level=high
      - name: Audit React Three Fiber adapter production boundary
        working-directory: adapters/react-three-fiber
        run: npm audit --omit=dev --audit-level=high
      - name: Test React Three Fiber adapter lifecycle
        working-directory: adapters/react-three-fiber
        run: npm test
      - name: Build React Three Fiber adapter
        working-directory: adapters/react-three-fiber
        run: npm run build
      - name: Install React Three Fiber demo dependencies
        working-directory: examples/react-three-fiber
        run: npm ci
      - name: Audit React Three Fiber demo
        working-directory: examples/react-three-fiber
        run: npm audit --audit-level=high
      - name: Audit React Three Fiber demo production boundary
        working-directory: examples/react-three-fiber
        run: npm audit --omit=dev --audit-level=high
      - name: Test React Three Fiber demo contracts
        working-directory: examples/react-three-fiber
        run: npm test
      - name: Build Brick route
        working-directory: examples/brick-offroad-hero
        run: npm run build
      - name: Test Brick capture isolation
        working-directory: examples/brick-offroad-hero
        run: npm run test:capture
      - name: Build Seoul route
        working-directory: examples/seoul-palace-hero
        run: npm run build
      - name: Test Seoul capture isolation
        working-directory: examples/seoul-palace-hero
        run: npm run test:capture
      - name: Build showcase
        working-directory: examples/showcase
        run: npm run build
      - name: Build Proof Lab
        working-directory: examples/proof-lab
        run: npm run build
      - name: Build React Three Fiber demo
        working-directory: examples/react-three-fiber
        run: npm run build
      - name: Run and publish self-contained proof
        run: >-
          python3 scripts/prove.py
          --output examples/proof-lab/dist/proof-run.json
          --commit "$GITHUB_SHA"
      - name: Assemble Pages artifact
        env:
          PAGES_DIR: ${{ runner.temp }}/threejs-sculpt-dna-pages
        run: |
          test ! -e "$PAGES_DIR"
          mkdir -p "$PAGES_DIR/brick" "$PAGES_DIR/seoul" "$PAGES_DIR/showcase" "$PAGES_DIR/proof" "$PAGES_DIR/react"
          cp -R examples/repolis-hero/dist/. "$PAGES_DIR/"
          cp -R examples/brick-offroad-hero/dist/. "$PAGES_DIR/brick/"
          cp -R examples/seoul-palace-hero/dist/. "$PAGES_DIR/seoul/"
          cp -R examples/showcase/dist/. "$PAGES_DIR/showcase/"
          cp -R examples/proof-lab/dist/. "$PAGES_DIR/proof/"
          cp -R examples/react-three-fiber/dist/. "$PAGES_DIR/react/"
          diff -qr examples/repolis-hero/dist "$PAGES_DIR" --exclude brick --exclude seoul --exclude showcase --exclude proof --exclude react
          diff -qr examples/brick-offroad-hero/dist "$PAGES_DIR/brick"
          diff -qr examples/seoul-palace-hero/dist "$PAGES_DIR/seoul"
          diff -qr examples/showcase/dist "$PAGES_DIR/showcase"
          diff -qr examples/proof-lab/dist "$PAGES_DIR/proof"
          diff -qr examples/react-three-fiber/dist "$PAGES_DIR/react"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/threejs-sculpt-dna-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
