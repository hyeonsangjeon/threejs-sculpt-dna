    <title>Three.js Sculpt DNA Showcase</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071019; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: 100%; height: 100%; }
      canvas { display: block; width: 100%; height: 100%; }
      .label {
        position: fixed;
        left: 28px;
        bottom: 24px;
        color: #f7fafc;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      .label h1 { margin: 0; font-size: 24px; letter-spacing: 0.02em; }
      .label span { display: block; margin-top: 5px; color: #b7c7d8; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
      .badge {
        position: fixed;
        right: 24px;
        top: 22px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        color: #d9e6f2;
        background: rgba(7, 16, 25, 0.55);
        backdrop-filter: blur(8px);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
      }
      .badge:hover, .badge:focus-visible {
        border-color: rgba(96, 218, 227, 0.72);
        color: #ffffff;
        outline: 2px solid rgba(96, 218, 227, 0.28);
        outline-offset: 3px;
      }
